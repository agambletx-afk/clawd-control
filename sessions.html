<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessions — Clawd Control</title>
    <style>
        .page-header { margin-bottom: 24px; }
        .page-header h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); text-shadow: 0 0 24px rgba(56, 189, 248, 0.18); }
        .page-header .subtitle { font-size: 13px; font-weight: 400; color: var(--text-secondary); margin-top: 4px; }

        .sub-nav {
          display: flex;
          gap: 2px;
          background: var(--bg-input, var(--bg-tertiary));
          border-radius: 9999px;
          padding: 3px;
          margin-bottom: 16px;
          width: fit-content;
        }
        .sub-nav-btn {
          padding: 6px 16px;
          border-radius: 9999px;
          border: none;
          background: transparent;
          color: var(--text-secondary);
          font-size: 13px;
          font-weight: 500;
          cursor: pointer;
          transition: all 150ms;
          white-space: nowrap;
        }
        .sub-nav-btn:hover { color: var(--text-primary); }
        .sub-nav-btn.active {
          background: var(--surface);
          color: var(--text-primary);
          font-weight: 600;
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .filters-bar {
            display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px 20px;
        }
        .filters-bar label { font-size: 0.85rem; color: var(--text-secondary); margin-right: 5px; }
        .filters-bar select, .filters-bar button {
            padding: 8px 12px; border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .filters-bar select:hover, .filters-bar button:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
        }
        .filters-bar button.active { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); }

        .event-log-table {
            width: 100%; border-collapse: collapse; font-size: 0.85rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .event-log-table th, .event-log-table td {
            padding: 12px 18px; text-align: left;
            border-bottom: 1px solid var(--border-subtle);
        }
        .event-log-table th {
            background: #1a1e30; color: var(--text-primary);
            font-weight: 600; text-transform: uppercase; font-size: 0.75rem;
            letter-spacing: 0.05em; cursor: pointer;
        }
        .event-log-table th:hover { background: var(--surface-hover); }
        .event-log-table tbody tr:last-child td { border-bottom: none; }
        
        .event-log-table tbody tr:hover { background: var(--surface-hover); }
        .session-row-clickable { cursor: pointer; }

        .type-badge {
            padding: 4px 8px; border-radius: var(--radius-sm);
            font-size: 0.7rem; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .type-badge.message { background: var(--info-bg); color: var(--info); }
        .type-badge.tool_call { background: var(--warning-bg); color: var(--warning); }
        .type-badge.model_change { background: #9333ea20; color: #9333ea; }
        .type-badge.session { background: var(--success-bg); color: var(--success); }
        .type-badge.heartbeat { background: var(--text-tertiary); color: var(--bg-secondary); }

        .transcript-header { background: #161b26; border: 1px solid #363b4d; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .transcript-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #e2e8f0; margin-bottom: 12px; }
        .transcript-title-capsule { width: 14px; height: 4px; border-radius: 999px; background: #38bdf8; }
        .transcript-meta-grid { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 10px; }
        .meta-item { background: #1e2535; border: 1px solid #363b4d; border-radius: 8px; padding: 10px; }
        .meta-k { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        .meta-v { font-size: 13px; color: #e2e8f0; font-weight: 600; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .status-pill { display: inline-flex; border-radius: 999px; padding: 6px 10px; font-size: 11px; font-weight: 700; }
        .status-available { background: rgba(56, 189, 248, 0.12); color: #38bdf8; }
        .status-live { background: rgba(56, 189, 248, 0.12); color: #38bdf8; }
        .status-summary_only { background: rgba(148, 163, 184, 0.12); color: #94a3b8; }

        .transcript-toolbar { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; align-items: center; }
        .toggle-row { display: flex; gap: 12px; color: #94a3b8; font-size: 12px; }
        .transcript-btn {
            background: #252a36;
            color: #f1f5f9;
            border: 1px solid #363b4d;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 150ms;
        }
        .transcript-btn:hover { background: rgba(56, 189, 248, 0.08); border-color: #4a5068; }

        .transcript-picker { background: #161b26; border: 1px solid #363b4d; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .picker-item { padding: 8px; border-radius: 8px; background: #1e2535; border: 1px solid #363b4d; margin-bottom: 8px; cursor: pointer; }

        .timeline-wrap { background: #161b26; border: 1px solid #363b4d; border-radius: 10px; padding: 12px; }
        .picker-item:hover {
            border-color: #4a5068;
            background: rgba(56, 189, 248, 0.04);
            transition: all 150ms;
        }

        .panel-subtitle { font-size: 12px; color: #94a3b8; font-weight: 400; margin-bottom: 12px; }
        .toggle-row input[type="checkbox"] {
            accent-color: #38bdf8;
            cursor: pointer;
        }
        .toggle-row label {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .timeline-header { margin-bottom: 10px; }
        .timeline-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; }

        .timeline-item { background: #1e2535; border: 1px solid #363b4d; border-radius: 8px; margin-bottom: 8px; padding: 10px; }
        .timeline-item.slim {
            background: transparent;
            border: none;
            border-top: 1px solid #363b4d;
            border-radius: 0;
            padding: 6px 10px;
            color: #94a3b8;
            font-size: 12px;
        }
        .timeline-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        .chip { font-size: 11px; border-radius: 999px; padding: 2px 8px; font-weight: 700; }
        .chip-user, .chip-assistant { background: rgba(56, 189, 248, 0.12); color: #38bdf8; }
        .chip-tool { background: rgba(148, 163, 184, 0.12); color: #94a3b8; }
        .chip-system { background: rgba(148, 163, 184, 0.08); color: #64748b; }
        .timeline-preview { color: #e2e8f0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .timeline-full { display: none; margin-top: 8px; max-height: 180px; overflow: auto; white-space: pre-wrap; border: 1px solid #363b4d; border-radius: 6px; padding: 8px; }
        .timeline-item.expanded .timeline-full { display: block; }
        .timeline-item .show-more { color: #38bdf8; cursor: pointer; font-size: 12px; }
        .indent-1 { margin-left: 24px; }
        .indent-2 { margin-left: 48px; }
        .banner { margin: 8px 0; padding: 8px; border-radius: 6px; border: 1px solid #363b4d; background: #1e2535; color: #cbd5e1; font-size: 12px; }
        .raw-panel { display: none; background: #0d1117; color: #cbd5e1; border: 1px solid #363b4d; border-radius: 8px; padding: 10px; white-space: pre; overflow: auto; max-height: 450px; }
        .waterfall-placeholder { background: #161b26; border: 1px solid #363b4d; border-radius: 10px; padding: 20px; color: #94a3b8; }

        :root { --sessions-domain: #38bdf8; }
        .overview-cards { display:grid; grid-template-columns: repeat(4,minmax(150px,1fr)); gap:10px; margin-bottom:10px; }
        .summary-card { position:relative; background:#1e2535; border:1px solid #363b4d; border-radius:12px; padding:10px 12px 10px 14px; overflow:hidden; }
        .summary-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background: linear-gradient(180deg, var(--sessions-domain), transparent); }
        .summary-label { font-size:11px; text-transform:uppercase; color:#94a3b8; letter-spacing:.08em; }
        .summary-value { font-size:22px; font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:#e2e8f0; }
        .summary-sub { font-size:12px; color:#94a3b8; }
        .overview-filters { display:flex; justify-content:space-between; gap:10px; margin: 8px 0 12px; flex-wrap: wrap; }
        .pill-group { display:flex; gap:6px; flex-wrap:wrap; }
        .pill { background:#161b26; border:1px solid #363b4d; color:#94a3b8; border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
        .pill.active { border-color:#38bdf8; color:#38bdf8; background:rgba(56,189,248,.08); }
        .status-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
        .status-active { background:#22c55e; box-shadow:0 0 0 0 rgba(34,197,94,.4); animation:pulse 2s infinite; }
        .status-closed { background:#64748b; }
        .status-stale { background:#f59e0b; }
        .status-failed { background:#ef4444; }
        .source-pill { padding:3px 8px; border-radius:999px; border:1px solid rgba(56,189,248,.35); background:rgba(56,189,248,.12); color:#7dd3fc; font-size:11px; }
        .mono-num { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
        .session-detail-row td { background:#161b26; }
        .session-detail { padding:10px; font-size:12px; color:#cbd5e1; line-height:1.5; }
        .active-strip { margin-bottom:10px; background:#161b26; border:1px solid #363b4d; border-radius:10px; padding:8px 10px; font-size:12px; color:#cbd5e1; }
        @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(34,197,94,.4);} 70% { box-shadow:0 0 0 6px rgba(34,197,94,0);} 100% { box-shadow:0 0 0 0 rgba(34,197,94,0);} }
    </style>
</head>
<body>
    <main class="main">
        <div class="page-header">
            <h1>Sessions</h1>
            <p class="subtitle">Active and recent gateway sessions.</p>
        </div>

        <div class="sub-nav" role="tablist" aria-label="Sessions views">
            <button class="sub-nav-btn active" data-view="overview">Overview</button>
            <button class="sub-nav-btn" data-view="transcript">Transcript</button>
            <button class="sub-nav-btn" data-view="waterfall">Waterfall</button>
        </div>

        <section id="listView" class="view-section active">
            <div id="overviewCards" class="overview-cards"></div>
            <div id="activeStrip" class="active-strip" style="display:none"></div>
            <div class="overview-filters">
                <div class="pill-group" id="sourcePills">
                    <button class="pill active" data-source-type="all">All</button>
                    <button class="pill" data-source-type="telegram">Telegram</button>
                    <button class="pill" data-source-type="heartbeat">Heartbeat</button>
                    <button class="pill" data-source-type="cron">Cron</button>
                    <button class="pill" data-source-type="dashboard">Dashboard</button>
                </div>
                <div class="pill-group" id="timePills">
                    <button class="pill active" data-range="24h">24h</button>
                    <button class="pill" data-range="3d">3d</button>
                    <button class="pill" data-range="7d">7d</button>
                    <button class="pill" data-range="30d">30d</button>
                </div>
            </div>
            <table class="event-log-table" id="eventLogTable">
                <thead>
                    <tr>
                        <th data-sort="status">Status</th>
                        <th data-sort="sourceType">Source</th>
                        <th data-sort="id">Session</th>
                        <th data-sort="primaryModel">Model</th>
                        <th data-sort="turnCount">Turns</th>
                        <th data-sort="totalTokens">Tokens</th>
                        <th data-sort="startedAt">Duration</th>
                        <th data-sort="lastActivityAt">Last Activity</th>
                    </tr>
                </thead>
                <tbody><tr><td colspan="8" style="text-align:center;">Loading sessions...</td></tr></tbody>
            </table>
        </section>

        <section id="transcriptView" class="view-section">
            <div id="backLinkWrap"></div>
            <div id="transcriptPicker" class="transcript-picker"></div>
            <div id="transcriptHeader" class="transcript-header"></div>
            <div id="transcriptBanners"></div>
            <div class="transcript-toolbar">
                <div class="toggle-row">
                    <label><input id="toggleToolResults" type="checkbox" checked> Tool results</label>
                    <label><input id="toggleSystem" type="checkbox"> System internals</label>
                    <label><input id="toggleCompaction" type="checkbox" checked> Compaction markers</label>
                </div>
                <div>
                    <button id="loadEarlier" class="transcript-btn">Load earlier</button>
                    <button id="jumpLatest" class="transcript-btn">Jump to latest</button>
                    <button id="toggleRaw" class="transcript-btn">View raw</button>
                </div>
            </div>
            <div id="rawPanel" class="raw-panel"></div>
            <div id="timeline" class="timeline-wrap"></div>
        </section>

        <section id="waterfallView" class="view-section">
            <div class="waterfall-placeholder">Waterfall view is planned for multi-agent deployment.</div>
        </section>

        <script>
            let currentRange = '24h';
            let currentSourceType = 'all';
            let sortField = 'lastActivityAt';
            let sortOrder = 'desc';
            let expandedSessionId = null;
            let transcriptState = { sessionId: null, entries: [], pagination: null, raw: '', current: null, rawOpen: false, summary: null };
            const FETCH_OPTS = { credentials: 'same-origin' };

            function escapeHtml(value) {
                return String(value || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function parseHash() {
                const raw = (window.location.hash || '#overview').replace(/^#/, '');
                const [viewPart, ...rest] = raw.split('&');
                const normalized = viewPart === 'list' ? 'overview' : (viewPart || 'overview');
                const params = new URLSearchParams(rest.join('&'));
                return { view: normalized, params };
            }

            function setHash(view, extras = {}) {
                const params = new URLSearchParams(extras);
                const suffix = params.toString();
                window.location.hash = suffix ? `#${view}&${suffix}` : `#${view}`;
            }

            function formatTokens(num) {
                const n = Number(num || 0);
                if (n >= 1000) return `${(n / 1000).toFixed(1)}K`;
                return String(Math.round(n));
            }

            function formatDuration(startedAt, endedAt, lastActivityAt) {
                const s = new Date(startedAt || 0).getTime();
                const e = new Date(endedAt || lastActivityAt || Date.now()).getTime();
                const ms = Math.max(0, e - s);
                const sec = Math.floor(ms / 1000);
                if (sec < 60) return `${sec}s`;
                const min = Math.floor(sec / 60);
                const rem = sec % 60;
                if (min < 60) return `${min}m ${rem}s`;
                const hr = Math.floor(min / 60);
                return `${hr}h ${min % 60}m`;
            }

            function relativeTime(ts) {
                const ms = Date.now() - new Date(ts || 0).getTime();
                const sec = Math.floor(ms / 1000);
                if (sec < 60) return `${sec}s ago`;
                const min = Math.floor(sec / 60);
                if (min < 60) return `${min}m ago`;
                const hr = Math.floor(min / 60);
                return `${hr}h ago`;
            }

            async function fetchOverview() {
                const map = { '24h': 1, '3d': 3, '7d': 7, '30d': 30 };
                const from = new Date(Date.now() - ((map[currentRange] || 1) * 24 * 60 * 60 * 1000)).toISOString();
                const params = new URLSearchParams({ from, sort: sortField, order: sortOrder, limit: '200' });
                if (currentSourceType !== 'all') params.set('sourceType', currentSourceType);
                const res = await fetch(`/api/sessions?${params.toString()}`, FETCH_OPTS);
                if (!res.ok) throw new Error('Session data unavailable. Check gateway connection.');
                return res.json();
            }

            function renderCards(summary) {
                const cards = [
                    ['ACTIVE SESSIONS', summary.activeCount || 0, 'Live now'],
                    [`SESSIONS (${currentRange.toUpperCase()})`, summary.sessionCount || 0, 'Filtered set'],
                    [`TOKENS (${currentRange.toUpperCase()})`, (summary.totalInputTokens || 0) + (summary.totalOutputTokens || 0), 'Input + output'],
                    ['AVG TOKENS/SESSION', summary.sessionCount ? Math.round(((summary.totalInputTokens || 0) + (summary.totalOutputTokens || 0)) / summary.sessionCount) : 0, 'Mean per session'],
                ];
                document.getElementById('overviewCards').innerHTML = cards.map(([label, value, sub]) => `
                    <div class="summary-card">
                        <div class="summary-label">${escapeHtml(label)}</div>
                        <div class="summary-value">${escapeHtml(formatTokens(value))}</div>
                        <div class="summary-sub">${escapeHtml(sub)}</div>
                    </div>
                `).join('');
            }

            function renderActiveStrip(sessions, summary) {
                const strip = document.getElementById('activeStrip');
                if (!(summary.activeCount > 0)) { strip.style.display = 'none'; strip.innerHTML = ''; return; }
                const active = sessions.filter((s) => s.status === 'active');
                strip.style.display = 'block';
                strip.innerHTML = `${active.length} active: ` + active.map((s) => `<span class="source-pill">${escapeHtml(s.sourceType)}${s.sourceName ? ':' + escapeHtml(s.sourceName) : ''}</span>`).join(' ');
            }

            function statusDot(status) {
                return `<span class="status-dot status-${escapeHtml(status)}"></span>`;
            }

            function renderOverviewTable(sessions) {
                const tbody = document.querySelector('#eventLogTable tbody');
                if (!sessions.length) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No sessions found for the selected filters.</td></tr>';
                    return;
                }
                tbody.innerHTML = sessions.map((s) => {
                    const totalTokens = Number(s.inputTokens || 0) + Number(s.outputTokens || 0);
                    const source = s.sourceName ? `${s.sourceType}: ${s.sourceName}` : s.sourceType;
                    return `<tr class="session-row-clickable" data-session-id="${escapeHtml(s.id)}">
                        <td>${statusDot(s.status)}</td>
                        <td><span class="source-pill">${escapeHtml(source)}</span></td>
                        <td class="mono-num">${escapeHtml(String(s.id).slice(0, 8))}</td>
                        <td class="mono-num">${escapeHtml(s.primaryModel || 'unknown')}</td>
                        <td class="mono-num">${escapeHtml(String(s.turnCount || 0))}</td>
                        <td class="mono-num">${escapeHtml(formatTokens(totalTokens))}</td>
                        <td class="mono-num">${escapeHtml(formatDuration(s.startedAt, s.endedAt, s.lastActivityAt))}</td>
                        <td>${escapeHtml(relativeTime(s.lastActivityAt))}</td>
                    </tr>
                    <tr class="session-detail-row" data-detail-id="${escapeHtml(s.id)}" style="display:${expandedSessionId === s.id ? 'table-row' : 'none'}"><td colspan="8"><div class="session-detail">
                        <div>${escapeHtml(source)} · ${escapeHtml(s.primaryModel || 'unknown')} · ${escapeHtml(s.startedAt || '--')} → ${escapeHtml(s.endedAt || 'active')} · <span class="source-pill">${escapeHtml(s.status)}</span></div>
                        <div>User turns: ${escapeHtml(s.turnCount)} · Tool calls: ${escapeHtml(s.toolCallCount || 0)} · Tool errors: ${escapeHtml(s.errorCount || 0)} · Total tokens: ${escapeHtml(totalTokens)}</div>
                        <div>User: ${escapeHtml((s.latestUserMessage || '').slice(0, 120))}</div>
                        <div>Assistant: ${escapeHtml((s.latestAssistantMessage || '').slice(0, 120))}</div>
                        <div><a href="#transcript&session=${encodeURIComponent(s.id)}" style="color:#38bdf8">View Full Transcript →</a></div>
                    </div></td></tr>`;
                }).join('');

                tbody.querySelectorAll('tr.session-row-clickable').forEach((row) => {
                    row.addEventListener('click', () => {
                        const id = row.dataset.sessionId;
                        expandedSessionId = expandedSessionId === id ? null : id;
                        renderOverview();
                    });
                });
            }

            async function renderOverview() {
                const tbody = document.querySelector('#eventLogTable tbody');
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Loading sessions...</td></tr>';
                try {
                    const data = await fetchOverview();
                    renderCards(data.summary || {});
                    renderActiveStrip(data.sessions || [], data.summary || {});
                    renderOverviewTable(data.sessions || []);
                } catch (e) {
                    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--error);">${escapeHtml(e.message)}</td></tr>`;
                }
            }

            function applyView() {
                const parsed = parseHash();
                const view = parsed.view;
                document.querySelectorAll('.sub-nav-btn').forEach((btn) => btn.classList.toggle('active', btn.dataset.view === view));
                document.querySelectorAll('.view-section').forEach((s) => s.classList.remove('active'));
                if (view === 'transcript') {
                    document.getElementById('transcriptView').classList.add('active');
                    const sid = parsed.params.get('session') || null;
                    renderBackLink(parsed.params);
                    if (sid && sid !== transcriptState.sessionId) loadTranscript(sid, true);
                    if (!sid) loadSessionPicker();
                } else if (view === 'waterfall') {
                    document.getElementById('waterfallView').classList.add('active');
                } else {
                    document.getElementById('listView').classList.add('active');
                    renderOverview();
                }
            }

            function renderBackLink(params) {
                const from = params.get('from');
                const taskId = params.get('taskId');
                const wrap = document.getElementById('backLinkWrap');
                if (from === 'usage') wrap.innerHTML = '<a href="analytics.html" style="color:#38bdf8;display:inline-block;margin-bottom:8px">← Back to Usage</a>';
                else if (from === 'tasks') wrap.innerHTML = `<a href="tasks.html#task=${escapeHtml(taskId || '')}" style="color:#38bdf8;display:inline-block;margin-bottom:8px">← Back to Task #${escapeHtml(taskId || '')} audit</a>`;
                else wrap.innerHTML = '';
            }

            function normalizePreview(text, maxLen) { return String(text || '').replace(/[#*_`>\[\]\(\)!-]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, maxLen); }
            function friendlyTool(name) { return String(name || 'Tool').split('_').map((p) => p.charAt(0).toUpperCase() + p.slice(1)).join(' '); }
            async function loadSessionPicker() {
                const picker = document.getElementById('transcriptPicker');
                picker.innerHTML = 'Loading recent sessions...';
                const res = await fetch('/api/sessions?limit=20', FETCH_OPTS);
                const data = await res.json();
                const sessions = data.sessions || [];
                if (!sessions.length) { picker.innerHTML = 'No recent sessions found.'; return; }
                picker.innerHTML = sessions.map((s) => `<div class="picker-item" data-session-id="${escapeHtml(s.id)}">🤖 ${escapeHtml(String(s.id).slice(0, 12))} · <span class="mono">${escapeHtml(s.primaryModel || 'unknown')}</span> · ${escapeHtml(new Date(s.lastActivityAt || Date.now()).toLocaleString())}</div>`).join('');
                picker.querySelectorAll('.picker-item').forEach((el) => el.addEventListener('click', () => setHash('transcript', { session: el.dataset.sessionId })));
            }

            function renderTranscriptHeader(session) {
                const wrap = document.getElementById('transcriptHeader');
                if (!session) { wrap.innerHTML = '<div class="transcript-title"><span class="transcript-title-capsule"></span>Transcript</div><div class="meta-v">Transcript not available.</div>'; return; }
                const started = session.startedAt ? new Date(session.startedAt).toLocaleString() : '--';
                wrap.innerHTML = `<div class="transcript-title"><span class="transcript-title-capsule"></span>Transcript</div><div class="panel-subtitle">Session metadata and status.</div><div class="transcript-meta-grid"><div class="meta-item"><div class="meta-k">Agent</div><div class="meta-v">${escapeHtml(session.agent || '--')}</div></div><div class="meta-item"><div class="meta-k">Source</div><div class="meta-v">${escapeHtml(session.source || 'Direct')}</div></div><div class="meta-item"><div class="meta-k">Model</div><div class="meta-v mono">${escapeHtml(session.model || '--')}</div></div><div class="meta-item"><div class="meta-k">Timing</div><div class="meta-v">${escapeHtml(started)}${session.active ? ' · Active' : ''}</div></div><div class="meta-item"><div class="meta-k">Status</div><div class="meta-v"><span class="status-pill status-${escapeHtml(session.transcriptStatus)}">${escapeHtml((session.transcriptStatus || '').replace('_', ' '))}</span></div></div></div>`;
            }

            function renderTranscriptBanners(session) {
                const wrap = document.getElementById('transcriptBanners');
                const bits = [];
                if (session?.active) bits.push('<div class="banner">Session active. Showing last complete entry.</div>');
                if (session?.branchDetected) bits.push('<div class="banner">This transcript contains branches. Showing chronological view.</div>');
                if ((session?.corruptionCount || 0) > 0) bits.push(`<div class="banner">Some entries in this transcript could not be read. ${escapeHtml(session.corruptionCount)} entries skipped.</div>`);
                if (transcriptState.summary) bits.push(`<div class="banner mono">Total tokens: ${escapeHtml(transcriptState.summary.totalTokens || 0)} (input: ${escapeHtml(transcriptState.summary.inputTokens || 0)}, output: ${escapeHtml(transcriptState.summary.outputTokens || 0)}, cache: ${escapeHtml(transcriptState.summary.cacheTokens || 0)}) · Turns: ${escapeHtml(transcriptState.summary.turns || 0)}</div>`);
                wrap.innerHTML = bits.join('');
            }

            function getIndentClass(entry) { if (entry.type === 'tool_call') return 'indent-1'; if (entry.type === 'tool_result') return 'indent-2'; return ''; }
            function summarizeEntry(entry) { if (entry.type === 'tool_call') return `Called ${friendlyTool(entry.toolName)}`.slice(0, 80); if (entry.type === 'tool_result') return entry.isError ? `Failed: ${normalizePreview(entry.content || '', 70)}` : 'Returned successfully'; if (entry.type === 'branch_summary') return `Branch summary ${normalizePreview(entry.summary || '', 60)}`; if (entry.type === 'compaction') return 'Context compacted'; if (entry.type === 'system_internal') return 'System note'; if (entry.type === 'unknown') return `Unknown event (${entry.rawType || 'unknown'})`; if (entry.type === 'corruption') return 'Entry could not be read'; return normalizePreview(entry.content || '', 150); }
            function chipFor(entry) { if (entry.type === 'user_message') return '<span class="chip chip-user">User</span>'; if (entry.type === 'assistant_message') return '<span class="chip chip-assistant">Assistant</span>'; if (entry.type === 'tool_call') return '<span class="chip chip-tool">Tool Call</span>'; if (entry.type === 'tool_result') return '<span class="chip chip-tool">Tool Result</span>'; if (entry.type === 'system_internal') return '<span class="chip chip-system">System</span>'; if (entry.type === 'unknown') return '<span class="chip chip-system">Unknown event</span>'; return ''; }

            function renderTimeline() {
                const target = document.getElementById('timeline');
                const showToolResults = document.getElementById('toggleToolResults').checked;
                const showSystem = document.getElementById('toggleSystem').checked;
                const showCompaction = document.getElementById('toggleCompaction').checked;
                const filtered = transcriptState.entries.filter((entry) => !((!showToolResults && entry.type === 'tool_result') || (!showSystem && entry.type === 'system_internal') || (!showCompaction && entry.type === 'compaction')));
                if (!filtered.length) { target.innerHTML = '<div class="timeline-item slim">Transcript not available.</div>'; return; }
                target.innerHTML = filtered.map((entry) => {
                    const slim = entry.type === 'compaction' || entry.type === 'branch_summary' || entry.type === 'corruption';
                    const full = escapeHtml(entry.content || entry.summary || JSON.stringify(entry, null, 2));
                    const preview = escapeHtml(summarizeEntry(entry));
                    const turnTokens = entry.type === 'assistant_message' && entry.usage ? Number(entry.usage.input || 0) + Number(entry.usage.output || 0) : null;
                    return `<div class="timeline-item ${slim ? 'slim' : ''} ${getIndentClass(entry)}" data-entry-id="${escapeHtml(entry.id)}"><div class="timeline-head">${chipFor(entry)} <span class="mono">${entry.timestamp ? escapeHtml(new Date(entry.timestamp).toLocaleTimeString()) : ''}</span><span class="mono" style="margin-left:auto;color:#64748b;font-size:11px;">${turnTokens !== null ? escapeHtml(turnTokens.toLocaleString() + ' tk') : ''}</span></div><div class="timeline-preview">${preview || '--'}</div><div class="timeline-full">${full}</div></div>`;
                }).join('');
            }

            async function loadTranscript(sessionId, reset = false) {
                transcriptState.sessionId = sessionId;
                document.getElementById('transcriptPicker').innerHTML = '';
                const limit = 100;
                const beforeParam = !reset && transcriptState.pagination?.oldestEntryId ? `&before=${encodeURIComponent(transcriptState.pagination.oldestEntryId)}` : '';
                const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/transcript?limit=${limit}${beforeParam}`, FETCH_OPTS);
                if (!res.ok) { renderTranscriptHeader(null); return; }
                const data = await res.json();
                transcriptState.current = data.session;
                transcriptState.pagination = data.pagination;
                transcriptState.raw = data.raw || '';
                transcriptState.summary = data.summary || null;
                transcriptState.entries = reset ? (data.entries || []) : [...(data.entries || []), ...transcriptState.entries];
                renderTranscriptHeader(data.session);
                renderTranscriptBanners(data.session);
                renderTimeline();
            }

            function initSessionsTab() {
                document.querySelectorAll('#sourcePills .pill').forEach((button) => button.addEventListener('click', () => {
                    document.querySelectorAll('#sourcePills .pill').forEach((b) => b.classList.remove('active'));
                    button.classList.add('active');
                    currentSourceType = button.dataset.sourceType;
                    renderOverview();
                }));
                document.querySelectorAll('#timePills .pill').forEach((button) => button.addEventListener('click', () => {
                    document.querySelectorAll('#timePills .pill').forEach((b) => b.classList.remove('active'));
                    button.classList.add('active');
                    currentRange = button.dataset.range;
                    renderOverview();
                }));
                document.querySelectorAll('#eventLogTable th[data-sort]').forEach((th) => th.addEventListener('click', () => {
                    const key = th.dataset.sort;
                    sortOrder = sortField === key && sortOrder === 'desc' ? 'asc' : 'desc';
                    sortField = key === 'totalTokens' ? 'inputTokens' : key;
                    renderOverview();
                }));
                document.querySelectorAll('.sub-nav-btn').forEach((btn) => btn.addEventListener('click', () => setHash(btn.dataset.view)));
                window.addEventListener('hashchange', applyView);
                document.getElementById('loadEarlier').addEventListener('click', () => { if (transcriptState.sessionId && transcriptState.pagination?.hasMore) loadTranscript(transcriptState.sessionId, false); });
                document.getElementById('jumpLatest').addEventListener('click', () => { if (transcriptState.sessionId) loadTranscript(transcriptState.sessionId, true); });
                document.getElementById('toggleRaw').addEventListener('click', () => {
                    transcriptState.rawOpen = !transcriptState.rawOpen;
                    const panel = document.getElementById('rawPanel');
                    panel.style.display = transcriptState.rawOpen ? 'block' : 'none';
                    panel.textContent = transcriptState.raw || 'No raw transcript available.';
                    document.getElementById('toggleRaw').textContent = transcriptState.rawOpen ? 'View formatted' : 'View raw';
                });
                ['toggleToolResults', 'toggleSystem', 'toggleCompaction'].forEach((id) => document.getElementById(id).addEventListener('change', renderTimeline));
                applyView();
            }

            initSessionsTab();
        </script>
    </main>
    <script src="/layout.js"></script>
</body>
</html>

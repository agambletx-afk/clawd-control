<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agents — Clawd Control</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --page-base: #0f1419;
      --panel-bg: #161b26;
      --card-bg: #1e2535;
      --border: #363b4d;
      --accent: #f59e0b;
      --text-primary: #c9d1d9;
      --text-muted: #8b949e;
      --pill-filled: #30363d;
    }

    body {
      margin: 0;
      background: var(--page-base);
      color: var(--text-primary);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 13px;
    }

    main.main {
      padding: 24px;
      max-width: 1600px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
    }

    .zone-a {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .stat-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
      min-height: 112px;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #f59e0b;
      border-radius: 8px 0 0 8px;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin: 0;
    }

    .stat-value {
      font-size: 28px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      margin: 0;
    }

    .stat-subtitle {
      margin: 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .zone-b {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-bg);
    }

    .domain-capsule {
      width: 16px;
      height: 4px;
      border-radius: 4px;
      background: #f59e0b;
      flex-shrink: 0;
    }

    .panel-title-wrap { display: grid; gap: 4px; }
    .panel-title { margin: 0; font-size: 14px; font-weight: 600; }
    .panel-subtitle { margin: 0; font-size: 12px; color: var(--text-muted); }

    .api-warning {
      margin: 16px 24px 0;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 12px;
      background: rgba(245, 158, 11, 0.12);
      display: none;
    }

    .roster-head,
    .agent-row {
      display: grid;
      grid-template-columns: 24px minmax(160px, 2fr) minmax(80px, 1fr) minmax(72px, auto) minmax(220px, 2fr) minmax(120px, 1fr) 16px 24px;
      gap: 16px;
      align-items: center;
      padding: 16px 24px;
    }

    .roster-head {
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--panel-bg);
    }

    .roster-head > div:first-child,
    .roster-head > div:nth-child(7),
    .roster-head > div:nth-child(8) { color: transparent; }

    .agent-item { border-bottom: 1px solid var(--border); }

    .agent-row {
      background: #1e2535;
      cursor: pointer;
      border: 0;
      text-align: left;
      width: 100%;
      color: inherit;
      font: inherit;
    }

    .agent-row:focus-visible {
      outline: 1px solid #f59e0b;
      outline-offset: -1px;
    }

    .bot-icon, .chevron-icon { width: 20px; height: 20px; stroke: #8b949e; fill: none; stroke-width: 2; }
    .chevron-icon { width: 16px; height: 16px; transition: transform 160ms ease; }
    .agent-item[aria-expanded="true"] .chevron-icon { transform: rotate(180deg); }

    .agent-name-wrap { display: grid; gap: 4px; min-width: 0; }
    .agent-name { margin: 0; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agent-id { margin: 0; font-size: 12px; color: var(--text-muted); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .field { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 56px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      line-height: 1;
      border: 1px solid var(--border);
      color: #8b949e;
      background: transparent;
    }
    .status-pill.active { background: #30363d; border-color: #30363d; color: #ffffff; }
    .status-pill.ready { color: #737d88; }

    .assignment { display: grid; gap: 4px; min-width: 0; }
    .assignment-title { font-size: 13px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .assignment-id { font-size: 12px; color: var(--text-muted); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    .tool-summary { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

    .health-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      justify-self: center;
    }
    .health-dot.green { background: #22c55e; }
    .health-dot.amber { background: #f59e0b; }
    .health-dot.red { background: #ef4444; }

    .detail-panel {
      background: #161b26;
      border-top: 1px solid #363b4d;
      padding: 16px 24px;
      display: none;
      gap: 16px;
    }
    .agent-item[aria-expanded="true"] .detail-panel { display: grid; }

    .detail-block { display: grid; gap: 8px; }
    .detail-title {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #8b949e;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .data-table th,
    .data-table td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #363b4d;
      font-size: 12px;
      color: #c9d1d9;
      vertical-align: top;
    }
    .data-table th { color: #8b949e; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    .data-table tr:last-child td { border-bottom: 0; }

    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .muted { color: #8b949e; }
    .dimmer { color: #737d88; }

    .tool-policy {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .tool-col { display: grid; gap: 8px; }
    .tool-col-head { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.04em; }
    .tool-list { margin: 0; padding: 0 0 0 16px; display: grid; gap: 4px; }
    .tool-list li { font-size: 12px; color: #c9d1d9; }

    .task-summary-line { font-variant-numeric: tabular-nums; font-size: 13px; color: #c9d1d9; }
    .task-list { display: grid; gap: 8px; }
    .task-row {
      display: grid;
      grid-template-columns: minmax(100px, auto) minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      background: #1e2535;
      border: 1px solid #363b4d;
      border-radius: 8px;
    }
    .risk-badge {
      border: 1px solid #363b4d;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      color: #8b949e;
    }

    .empty {
      color: #8b949e;
      font-size: 12px;
      font-style: italic;
    }

    @media (max-width: 1280px) {
      .zone-a { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .roster-head,
      .agent-row {
        grid-template-columns: 24px minmax(140px, 2fr) minmax(80px, 1fr) minmax(72px, auto) minmax(180px, 2fr) minmax(100px, 1fr) 16px 24px;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="main">
    <section class="zone-a" id="summaryCards"></section>

    <section class="zone-b">
      <header class="panel-header">
        <span class="domain-capsule" aria-hidden="true"></span>
        <div class="panel-title-wrap">
          <p class="panel-title">Agent Roster</p>
          <p class="panel-subtitle">Fleet readiness and per-agent diagnostics</p>
        </div>
      </header>
      <div class="api-warning" id="apiWarning">Unable to reach agents API. Showing last known data.</div>
      <div class="roster-head" aria-hidden="true">
        <div>&nbsp;</div><div>Agent</div><div>Model</div><div>Status</div><div>Latest Assignment</div><div>Tools</div><div>&nbsp;</div><div>&nbsp;</div>
      </div>
      <div id="agentRoster"></div>
    </section>
  </main>

  <script type="module">
    const summaryCardsEl = document.getElementById('summaryCards');
    const rosterEl = document.getElementById('agentRoster');
    const warningEl = document.getElementById('apiWarning');

    const STATE = {
      agents: [],
      summary: { registered: 0, healthy: 0, needs_attention: 0, active: 0 },
      expandedId: null,
      detailsCache: new Map(),
    };

    const WORKSPACE_FILES = ['AGENTS.md', 'SOUL.md', 'IDENTITY.md', 'TOOLS.md', 'HEARTBEAT.md', 'USER.md'];
    const REQUIRED_FILES = new Set(['AGENTS.md', 'SOUL.md', 'IDENTITY.md', 'TOOLS.md']);

    const esc = (v) => String(v ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
    const trunc = (txt, n) => (String(txt ?? '').length > n ? `${String(txt).slice(0, n - 1)}…` : String(txt ?? ''));
    const normalizeModel = (m) => {
      const model = String(m ?? '—');
      if (model.length <= 20 || !model.includes('/')) return model;
      return model.split('/').pop() || model;
    };

    function botIcon() {
      return '<svg class="bot-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="7" width="12" height="10" rx="2"></rect><path d="M12 3v4"></path><circle cx="9" cy="12" r="1"></circle><circle cx="15" cy="12" r="1"></circle><path d="M8 17v2M16 17v2M3 10h3M18 10h3"></path></svg>';
    }

    function chevronIcon() {
      return '<svg class="chevron-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>';
    }

    function buildSummaryCards() {
      const cards = [
        ['REGISTERED', STATE.summary.registered, 'Configured in gateway'],
        ['HEALTHY', STATE.summary.healthy, 'All checks passing'],
        ['NEEDS ATTENTION', STATE.summary.needs_attention, 'Health checks failing'],
        ['ACTIVE', STATE.summary.active, 'Session active in last 5m'],
      ];
      summaryCardsEl.innerHTML = cards.map(([label, value, subtitle]) => `
        <article class="stat-card">
          <p class="stat-label">${label}</p>
          <p class="stat-value">${Number(value ?? 0)}</p>
          <p class="stat-subtitle">${subtitle}</p>
        </article>
      `).join('');
    }

    function statusPillClass(status) {
      const s = String(status || '').toLowerCase();
      if (s === 'active') return 'active';
      if (s === 'ready') return 'ready';
      return 'idle';
    }

    function getHealthClass(status) {
      const s = String(status || '').toLowerCase();
      if (s === 'red') return 'red';
      if (s === 'amber' || s === 'yellow') return 'amber';
      return 'green';
    }

    function renderRoster() {
      rosterEl.innerHTML = STATE.agents.map((agent) => {
        const id = String(agent.id || 'unknown');
        const expanded = STATE.expandedId === id;
        const modelFull = String(agent.model || agent.default_model || '—');
        const modelShort = normalizeModel(modelFull);
        const assignment = agent.latest_assignment || null;
        const taskTitle = assignment?.title ? trunc(assignment.title, 40) : '--';
        const taskId = assignment?.id ? String(assignment.id) : '';
        const allowed = Number(agent.tools?.allowed ?? agent.tool_policy?.allowed?.length ?? 0);
        const denied = Number(agent.tools?.denied ?? agent.tool_policy?.denied?.length ?? 0);
        const status = String(agent.status || 'Idle');
        const healthClass = getHealthClass(agent.health?.status);

        return `
          <article class="agent-item" data-agent-id="${esc(id)}" aria-expanded="${expanded ? 'true' : 'false'}">
            <button class="agent-row" type="button" aria-expanded="${expanded ? 'true' : 'false'}" aria-controls="detail-${esc(id)}">
              <div>${botIcon()}</div>
              <div class="agent-name-wrap">
                <p class="agent-name">${esc(agent.name || id)}</p>
                <p class="agent-id">${esc(id)}</p>
              </div>
              <div class="field" title="${esc(modelFull)}">${esc(modelShort)}</div>
              <div><span class="status-pill ${statusPillClass(status)}">${esc(status)}</span></div>
              <div class="assignment">
                <div class="assignment-title muted">${esc(taskTitle)}</div>
                <div class="assignment-id">${taskId ? esc(taskId) : ''}</div>
              </div>
              <div class="tool-summary">${allowed} allowed, ${denied} denied</div>
              <div><span class="health-dot ${healthClass}" title="${esc(agent.health?.status || 'green')}"></span></div>
              <div>${chevronIcon()}</div>
            </button>
            <section id="detail-${esc(id)}" class="detail-panel" aria-live="polite"></section>
          </article>
        `;
      }).join('');

      rosterEl.querySelectorAll('.agent-row').forEach((row) => {
        row.addEventListener('click', () => toggleRow(row.closest('.agent-item')?.dataset.agentId || ''));
        row.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggleRow(row.closest('.agent-item')?.dataset.agentId || '');
          }
        });
      });

      if (STATE.expandedId) {
        const expandedEl = rosterEl.querySelector(`.agent-item[data-agent-id="${CSS.escape(STATE.expandedId)}"]`);
        if (expandedEl) {
          loadDetails(STATE.expandedId, expandedEl.querySelector('.detail-panel'));
        }
      }
    }

    async function fetchFleet(showWarningOnError = true) {
      try {
        const response = await fetch('/api/agents', { headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        STATE.summary = data.summary || STATE.summary;
        STATE.agents = Array.isArray(data.agents) ? data.agents : [];
        warningEl.style.display = 'none';
        buildSummaryCards();
        renderRoster();
      } catch (error) {
        if (showWarningOnError) warningEl.style.display = 'block';
        buildSummaryCards();
        renderRoster();
      }
    }

    function renderWorkspaceFiles(detail) {
      const map = detail.workspace_files || detail.workspace?.files || {};
      const normalized = new Map();
      Object.entries(map).forEach(([k, v]) => normalized.set(String(k).toUpperCase(), v));

      const rows = WORKSPACE_FILES.map((name) => {
        const file = normalized.get(name.toUpperCase());
        const present = Boolean(file?.present);
        let statusText = 'Present';
        let statusClass = '';
        if (!present) {
          if (REQUIRED_FILES.has(name)) {
            statusText = 'Missing — required';
            statusClass = 'muted';
          } else {
            statusText = 'Missing — optional';
            statusClass = 'dimmer';
          }
        }
        const modified = file?.last_modified_human || file?.last_modified || '--';
        return `<tr><td class="mono">${name}</td><td class="${statusClass}">${esc(statusText)}</td><td class="muted">${esc(modified)}</td></tr>`;
      }).join('');

      return `
        <div class="detail-block">
          <h4 class="detail-title">Workspace Files</h4>
          <table class="data-table">
            <thead><tr><th>File</th><th>Status</th><th>Last Modified</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderToolPolicy(detail) {
      const allowed = detail.tool_policy?.allowed || [];
      const denied = detail.tool_policy?.denied || [];
      const list = (items) => items.length
        ? `<ul class="tool-list mono">${items.slice(0, 50).map((t) => `<li>${esc(t)}</li>`).join('')}</ul>`
        : '<p class="empty">None</p>';
      return `
        <div class="detail-block">
          <h4 class="detail-title">Tool Policy</h4>
          <div class="tool-policy">
            <div class="tool-col"><div class="tool-col-head">Allowed</div>${list(allowed)}</div>
            <div class="tool-col"><div class="tool-col-head">Denied</div>${list(denied)}</div>
          </div>
        </div>
      `;
    }

    function renderSessions(detail) {
      const sessions = Array.isArray(detail.recent_sessions) ? detail.recent_sessions.slice(0, 5) : [];
      if (!sessions.length) {
        return `<div class="detail-block"><h4 class="detail-title">Recent Sessions</h4><p class="empty">No sessions recorded</p></div>`;
      }
      const rows = sessions.map((s) => `
        <tr>
          <td class="mono">${esc(s.id || s.session_id || '--')}</td>
          <td class="muted">${esc(s.started_human || s.started || '--')}</td>
          <td class="muted">${esc(s.duration_human || s.duration || '--')}</td>
          <td class="muted">${esc(String(s.status || '--').toLowerCase())}</td>
          <td class="muted">${esc(normalizeModel(s.model || '--'))}</td>
        </tr>
      `).join('');
      return `
        <div class="detail-block">
          <h4 class="detail-title">Recent Sessions</h4>
          <table class="data-table">
            <thead><tr><th>Session</th><th>Started</th><th>Duration</th><th>Status</th><th>Model</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderTaskSummary(detail) {
      const summary = detail.task_summary || {};
      const recent = Array.isArray(detail.recent_tasks) ? detail.recent_tasks.slice(0, 5) : [];
      const rows = recent.length ? recent.map((task) => `
        <div class="task-row">
          <div class="mono muted">${esc(task.id || '--')}</div>
          <div title="${esc(task.title || '--')}">${esc(trunc(task.title || '--', 50))}</div>
          <div class="muted">${esc(String(task.status || '--').toLowerCase())}</div>
          <div class="risk-badge mono">${esc(task.risk_class || '--')}</div>
        </div>
      `).join('') : '<p class="empty">No tasks recorded</p>';

      return `
        <div class="detail-block">
          <h4 class="detail-title">Task Summary</h4>
          <div class="task-summary-line">${Number(summary.active ?? 0)} active · ${Number(summary.completed_7d ?? 0)} completed (7d) · ${Number(summary.failed_7d ?? 0)} failed (7d)</div>
          <div class="task-list">${rows}</div>
        </div>
      `;
    }

    function renderSpawnedBy(detail) {
      const text = detail.spawned_by_text || detail.spawned_by || '--';
      return `<div class="detail-block"><h4 class="detail-title">Spawned By</h4><div class="muted">${esc(String(text))}</div></div>`;
    }

    function renderDetail(detailPanel, detailData) {
      detailPanel.innerHTML = [
        renderWorkspaceFiles(detailData),
        renderToolPolicy(detailData),
        renderSessions(detailData),
        renderTaskSummary(detailData),
        renderSpawnedBy(detailData),
      ].join('');
    }

    async function loadDetails(agentId, detailPanel) {
      if (!detailPanel) return;
      const now = Date.now();
      const cached = STATE.detailsCache.get(agentId);
      if (cached && now - cached.fetchedAt < 60000) {
        renderDetail(detailPanel, cached.data);
        return;
      }

      detailPanel.innerHTML = '<p class="empty">Loading details…</p>';
      try {
        const response = await fetch(`/api/agents/${encodeURIComponent(agentId)}`, { headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const detailData = await response.json();
        STATE.detailsCache.set(agentId, { data: detailData, fetchedAt: now });
        if (STATE.expandedId === agentId) renderDetail(detailPanel, detailData);
      } catch {
        detailPanel.innerHTML = '<p class="empty">Unable to load details</p>';
      }
    }

    function toggleRow(agentId) {
      if (!agentId) return;
      STATE.expandedId = STATE.expandedId === agentId ? null : agentId;
      renderRoster();
    }

    buildSummaryCards();
    fetchFleet();
    setInterval(() => fetchFleet(false), 30000);
  </script>

  <script src="/layout.js"></script>
</body>
</html>
